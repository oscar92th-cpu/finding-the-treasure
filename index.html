function ans(ok,to){const q=cur;if(q.over)return;q.over=1;clearInterval(tm);const s=q.s,x=nx(s),y=ny(s,q.d);let m,d=0;
if(q.boss){shk=ok?20:8;if(ok){g.done[s]=1;g.crew.push(rf());d=30;g.pos=s;aim(s,0);burst(x,y,26);m='Boss defeated! 🎉 +1 crew member · bonus ×3 = +30 points';g.fc='255,220,90';fl=.9}else m='No points this time – but nothing is lost. The boss is waiting for a rematch!'}
else if(q.fin){d=ok?50:-5;g.fin++;m=ok?'Score ×5 → +50 points!':'−5 points (score never goes below 0)';if(ok)burst(x,y,20)}
else if(ok){d=10;g.pos=s;g.path[s]=q.d;const f=g.vil[s][q.d];g.crew.push(f);aim(s,q.d);fly(f,x,y-30*sc,sh.tx+30*sc,sh.ty-10*sc);burst(x,y,10);m=`+10 points · ${f} joined your crew!`;if(LV(s+1)!=LV(s)&&s<15)m+=`<br>🌊 New level: ${LN[LV(s+1)]}`}
else{const f=g.vil[s][q.d];burst(x,y-30*sc,10,['💨','💨','💦']);g.vil[s][q.d]=rf();const p=Math.max(0,g.pos-1);g.pos=p;aim(p,g.path[p]||0);m=`${f} left the island… 💨<br>The ship sails back${p<s-1||s==1?'':' 1 stage'}. Your score and crew are safe.`;fl=.8;g.fc='255,60,60'}
if(!ok)g.wrong++;g.score=Math.max(0,g.score+d);ok?good():bad();hud();
const a=q.mcq?q.qd[0].replace('___','<b>'+q.qd[1]+'</b>'):q.ans,last=q.fin&&g.fin>=3;
$('#q').innerHTML=`<div class="fb ${ok?'ok':'no'}">${ok?'Correct! ✅':'Incorrect! ❌'}</div>${to?'<div>⏰ Time’s up!</div>':''}<p>${m}</p><div class="ans">Answer: ${a}</div><button class="gold" id="nx" style="width:100%">${last?'🗝️ Open the treasure chest!':'Next ➜'}</button>`;
$('#nx').onclick=()=>last?chest():next()}
function chest(){g.open=1;burst(nx(16),ny(16,0),60,['🪙','💰','⭐','🎉']);good();$('#nx').disabled=1;setTimeout(finish,2600)}
const LB=()=>{try{return JSON.parse(localStorage.getItem('ptlb')||'[]')}catch(e){return[]}};
function finish(){clearInterval(mi);const e={id:Date.now(),n:g.name,s:g.score,t:Math.round((Date.now()-g.t0)/1000),w:g.wrong,c:g.crew.length};const l=LB();l.push(e);try{localStorage.setItem('ptlb',JSON.stringify(l))}catch(x){}board(e.id,1)}
function board(id,fin){const l=LB().sort((a,b)=>b.s-a.s||a.t-b.t),R=['🥇 1st','🥈 2nd','🥉 3rd'],me=l.findIndex(x=>x.id==id);
$('#res').innerHTML=`<div class="c"><div style="font-size:64px">${fin?(me<3?'🏆':'💰'):'🏆'}</div><h1>${fin?'Treasure Claimed!':'Leaderboard'}</h1>${fin?`<p style="font-size:1.3em">${g.av} <b>${g.name}</b> · ${R[me]||(me+1)+'th'} place · ⭐ ${g.score}</p>`:''}</div>
<div style="overflow-x:auto"><table><tr><th>Rank</th><th>Pirate</th><th>Score</th><th>Time</th><th>Wrong</th><th>Crew</th></tr>${l.slice(0,25).map((x,i)=>`<tr class="${x.id==id?'me':''}"><td>${R[i]||(i+1)+'th'}</td><td>🏴‍☠️ ${x.n.replace(/</g,'&lt;')}</td><td>${x.s}</td><td>${fmt(x.t)}</td><td>${x.w}</td><td>${x.c}</td></tr>`).join('')||'<tr><td colspan=6>No pirates yet!</td></tr>'}</table></div>
<div style="display:grid;gap:8px;grid-template-columns:1fr 1fr;margin-top:14px"><button class="gold" id="ag">⚓ Next pirate</button><button id="cl">🗑 Clear board</button></div>`;show('res');$('#ag').onclick=()=>{$('#nm').value='';g=null;show('setup')};$('#cl').onclick=()=>{try{localStorage.removeItem('ptlb')}catch(e){}board(0,0)}}
$('#gf').onclick=()=>{fem=true;$('#gf').className='on';$('#gm').className=''};$('#gm').onclick=()=>{fem=false;$('#gm').className='on';$('#gf').className=''};
$('#go').onclick=start;$('#lb0').onclick=()=>board(0,0);addEventListener('resize',()=>{rs();if(g)aim(Math.max(0,g.pos),g.path[g.pos]||0)});requestAnimationFrame(frame);
</script></body></html>
